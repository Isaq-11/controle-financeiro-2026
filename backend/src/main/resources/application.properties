spring.application.name=backend
spring.config.import=optional:classpath:application-secrets.properties
spring.messages.basename=messages

spring.datasource.url=jdbc:mysql://gateway01.sa-east-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}

# Criação da Tabela
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8081}

#configuração email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=isaquecarvalhoxavier@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Integração com IA (Google Gemini - Plano Gratuito via Google AI Studio)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
