services:
  # ==============================================================================
  # Banco de Dados MySQL 8.0
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: financeiro-mysql
    restart: always
    environment:
      MYSQL_DATABASE: financeiro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeiro-network

  # ==============================================================================
  # Backend Spring Boot
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeiro-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/financeiro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-flash-lite-latest
    ports:
      - "8081:8081"
    networks:
      - financeiro-network

  # ==============================================================================
  # Frontend React (Vite + Nginx)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081
    container_name: financeiro-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - financeiro-network

volumes:
  mysql_data:
    driver: local

networks:
  financeiro-network:
    driver: bridge

