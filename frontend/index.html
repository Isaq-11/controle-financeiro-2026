<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Controle Financeiro Pessoal & Compartilhado</title>

  <!-- PWA Primary Tags -->
  <meta name="description"
    content="Gestão inteligente de finanças pessoais, carteiras compartilhadas em tempo real e relatórios com IA." />
  <meta name="theme-color" content="#f3f5f2" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Aplica o tema salvo antes da primeira pintura (evita piscar claro/escuro).
    try {
      var t = localStorage.getItem("tema");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { }
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Apple iOS Safari PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finanças" />
  <link rel="apple-touch-icon" href="/icons/pwa-192x192.svg" />

  <!-- Microsoft Tiles Support -->
  <meta name="msapplication-TileColor" content="#121c17" />
  <meta name="msapplication-TileImage" content="/icons/pwa-192x192.svg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
